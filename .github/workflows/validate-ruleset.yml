name: Validate dynamic ruleset

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dynamic rules
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Check out Flutter Agents CLI
        uses: actions/checkout@v4
        with:
          repository: dhikaz007/flutter_agents_cli
          path: flutter_agents_cli

      - name: Install CLI dependencies
        working-directory: flutter_agents_cli
        run: dart pub get

      - name: Validate ruleset structure and profile metadata
        working-directory: flutter_agents_cli
        env:
          FLUTTER_AGENTS_HOME: ${{ runner.temp }}/flutter-agents
        run: |
          dart run bin/agents.dart ruleset add vibe-coding-rules "$GITHUB_WORKSPACE"
          dart run bin/agents.dart ruleset validate vibe-coding-rules

      - name: Guard universal rules against stack-specific APIs
        run: |
          if grep -nEi 'go_router|go_router_builder|get_it|getit|injectable|lazysingleton|flutter_modular|modular\.get|ChildRoute|ModuleRoute|RouteGuard|addsingleton|exportedBinds|\bBind\b|r\.child|r\.module' rules/*.md; then
            echo "::error::rules/*.md is universal and must not name a stack-specific API. Delegate to profiles/<selected>/."
            exit 1
          fi

      - name: Guard universal rules against project-local symbols
        run: |
          if grep -nE 'AppButton|AppText|AppTextField|AppSvg|AppSpacing|AppDimensions|AppDateFormatter|PaginationFAB|core/widgets|presentation/widgets' rules/*.md; then
            echo "::error::rules/*.md must resolve symbols and paths via docs/dynamic-rules/PROJECT-CONVENTIONS.md, not hardcode project-local names."
            exit 1
          fi

      - name: Verify conventions template shape
        run: |
          tpl=templates/PROJECT-CONVENTIONS.md
          for role in text button text_field svg feedback date_formatter spacing pagination_fab; do
            grep -q "| $role |" "$tpl" || { echo "::error::template missing role $role"; exit 1; }
          done
          grep -q "## Unresolved" "$tpl" || { echo "::error::template missing ## Unresolved"; exit 1; }
          grep -q "mode:" "$tpl" || { echo "::error::template missing mode comment"; exit 1; }

  profile-smoke-test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - go_router_get_it
          - flutter_modular_v5
          - flutter_modular_v6
          - flutter_modular_v7
    steps:
      - name: Check out dynamic rules
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Check out Flutter Agents CLI
        uses: actions/checkout@v4
        with:
          repository: dhikaz007/flutter_agents_cli
          path: flutter_agents_cli

      - name: Install CLI dependencies
        working-directory: flutter_agents_cli
        run: dart pub get

      - name: Initialize and apply profile
        env:
          FLUTTER_AGENTS_HOME: ${{ runner.temp }}/flutter-agents
          PROFILE: ${{ matrix.profile }}
        run: |
          dart run "$GITHUB_WORKSPACE/flutter_agents_cli/bin/agents.dart" ruleset add vibe-coding-rules "$GITHUB_WORKSPACE"
          project="$RUNNER_TEMP/profile-smoke-$PROFILE"
          mkdir -p "$project"
          cd "$project"
          dart run "$GITHUB_WORKSPACE/flutter_agents_cli/bin/agents.dart" init --yes
          dart run "$GITHUB_WORKSPACE/flutter_agents_cli/bin/agents.dart" ruleset use vibe-coding-rules "$PROFILE"
          dart run "$GITHUB_WORKSPACE/flutter_agents_cli/bin/agents.dart" ruleset map --all
          test -f PROJECT_PROFILE.md
          grep -Fx "profile: $PROFILE" PROJECT_PROFILE.md
          test -f "docs/dynamic-rules/profiles/$PROFILE/ARCHITECTURE.md"
          test -f "docs/dynamic-rules/profiles/$PROFILE/ROUTING.md"
          grep -q "docs/dynamic-rules" AGENTS.md
          test "$(ls docs/dynamic-rules/profiles | wc -l)" -eq 1
          for source in "$GITHUB_WORKSPACE"/rules/*.md; do
            name="$(basename "$source")"
            if [ ! -f "docs/dynamic-rules/rules/$name" ]; then
              echo "::error::universal rule $name did not install into the project"
              exit 1
            fi
          done
